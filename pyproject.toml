[build-system]
# setuptools >= 77 for the SPDX `license` expression (PEP 639)
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "random_kingdominion"
version = "0.1.2"
authors = [
    { name = "Fabian Balzer" }
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.txt"]
description = "Tool to do cool stuff all around the board game Dominion."
readme = "README.md"
keywords = ["dominion", "board game", "card game", "deck building"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# Loose lower bounds describing the package; the exact versions the app is verified
# with are pinned in requirements.txt (what the deployed app installs).
# `dependency_pins_test.py` checks that both lists agree.
# Only the Streamlit floor is a known requirement (fragment reruns, `on_change="rerun"`,
# theme padding); the others are the release series currently in use.
dependencies = [
    "streamlit>=1.66",
    "pandas>=2.2",
    "numpy>=2.0",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "PyYAML>=6.0",
    "scipy>=1.13",
    "streamlit-extras>=0.7",
    "st-copy-to-clipboard>=0.1.6",
    "colorama>=0.4",
]
requires-python = ">=3.11"

[project.optional-dependencies]
# Data maintenance scripts (scripts/, utils/data_setup/): beautifulsoup4 parses the
# saved wiki card list, requests and yt-dlp fetch the YouTube video info
scripts = [
    "requests",
    "beautifulsoup4",
    "yt-dlp",
]
test = ["pytest>=8"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
markers = [
    "slow: drives a page through Streamlit's AppTest (seconds per test); skip with -m 'not slow'",
]
