
[server]
enableStaticServing = true

[runner]
enforceSerializableSessionState = true

[theme]
primaryColor = "#388E3C"
backgroundColor = "#333333"
secondaryBackgroundColor = "#555555"
textColor = "#FFFFFF"
font = "sans serif"
# Gap below the header and at the end of the page (Streamlit >= 1.66; default ~6rem
# at the top including the header, which Streamlit adds on its own)
paddingTop = "1rem"
paddingBottom = "2rem"

[global]
showWarningOnDirectExecution = false
disableWidgetStateDuplicationWarning = true
