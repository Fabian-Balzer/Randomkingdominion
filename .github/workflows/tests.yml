# Runs the whole test suite (including the slow Streamlit page tests) on GitHub's
# servers for every push to main, every pull request, and on demand. For main, it
# then warms up the deployed app (scripts/warm_up_app.py).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" button in the Actions tab

# A newer push to the same branch cancels the run that is still going
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        # The exact pins of the deployment first, then the package itself with the
        # extras the tests need (Streamlit, yt-dlp, beautifulsoup4, pytest,
        # pytest-xdist, Black, ruff)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[app,scripts,test]"

      - name: Check formatting and lint
        # Settings in pyproject.toml; fails before the (longer) tests run
        run: |
          python -m black --check --diff .
          python -m ruff check .

      - name: Run the tests
        # In parallel, one worker per CPU core
        run: python -m pytest randomizer_modules_tests -n auto

  warm-up:
    # Loads the TGG Dailies into the deployed app's caches, so that its first visitor
    # doesn't wait for them. After the tests, which gives Community Cloud a few
    # minutes to pick up the push (it doesn't signal when it's done).
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The app being slow to wake up shouldn't mark the commit as failed
    continue-on-error: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Playwright with Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Open the Oracle and the quiz with the TGG Dailies
        # -u: without a terminal, Python would only print the log at the end
        run: python -u scripts/warm_up_app.py

      - name: Attach what the browser saw
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: warm-up-failure
          path: warm_up_failure.png
          if-no-files-found: ignore
